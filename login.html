<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Telegram Style</title>
    <style>
        /* Reset Dasar */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            /* Menggunakan background.JPG sesuai permintaan */
            background: url('background.JPG') no-repeat center center/cover;
            position: relative;
        }

        /* Overlay gelap transparan agar teks di form lebih mudah dibaca */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3);
            z-index: 1;
        }

        /* Kontainer Utama Login */
        .login-container {
            position: relative;
            z-index: 2;
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        /* Bagian Logo */
        .logo-area {
            margin-bottom: 24px;
        }

        .logo-area img {
            width: 80px; /* Ukuran logo bisa disesuaikan */
            height: auto;
            object-fit: contain;
        }

        /* Judul Teks */
        h2 {
            color: #333333;
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        p.subtitle {
            color: #707579;
            font-size: 14px;
            margin-bottom: 32px;
        }

        /* Gaya Form Input */
        .input-group {
            position: relative;
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            color: #2481cc;
            font-weight: 500;
            margin-bottom: 6px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid #dadce0;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            border-color: #2481cc;
        }

        /* Tombol Login ala Telegram */
        .btn-login {
            width: 100%;
            padding: 14px;
            background-color: #2481cc; /* Warna khas Telegram biru */
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-login:hover {
            background-color: #1e71b3;
        }

        /* Link Tambahan */
        .footer-links {
            margin-top: 24px;
        }

        .footer-links a {
            color: #2481cc;
            text-decoration: none;
            font-size: 14px;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="logo-area">
            <img src="logo.PNG" alt="Logo">
        </div>

        <h2>Masuk ke Chat</h2>
        <p class="subtitle">Silakan masukkan detail akun Anda untuk melanjutkan.</p>

        <form action="#" method="POST">
            <div class="input-group">
                <label for="username">Nomor Telepon / Username</label>
                <input type="text" id="username" placeholder="Contoh: +62812345678" required>
            </div>

            <div class="input-group">
                <label for="password">Kata Sandi</label>
                <input type="password" id="password" placeholder="Masukkan kata sandi" required>
            </div>

            <button type="submit" class="btn-login">LANJUTKAN</button>
        </form>

<div class="footer-links">
            <a href="#">Lupa Kata Sandi?</a>
        </div>
    </div> <script src="script.js"></script>
</body>
</html>
